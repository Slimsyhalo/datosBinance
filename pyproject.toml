[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-btc-eth-research"
version = "0.1.0"
description = "Auditable Binance USD-M BTC/ETH five-month research data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "websockets>=15,<16"]

[project.scripts]
quantdata = "quantdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
